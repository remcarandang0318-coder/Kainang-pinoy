function setCat(c){cur=c;renderTabs();render();}
function render(){
 let list=items.filter(it=>cur==="All"||it.c===cur);
 document.getElementById('count').innerText=list.length+" items • 96 items total";
 document.getElementById('menu').innerHTML=list.map(it=>{
   let idx=items.indexOf(it);

}
function add(i){cart[i]=(cart[i]||0)+1;update();}
function update(){
 let total=Object.keys(cart).reduce((s,k)=>s+items[k].p*cart[k],0);
 document.getElementById('total').innerText=total.toFixed(3)+' KD';
 document.getElementById('ctext').innerText=total.toFixed(3)+' KD';
 document.getElementById('need').innerText=total>=8?'✅ FREE DELIVERY!':'Add '+(8-total).toFixed(3)+' KD for FREE';
}
function order(){
 let msg='Hello KAINAN PINOY! New Order:%0A';
 Object.keys(cart).forEach(k=>{msg+=`${cart[k]}x ${items[k].n} - ${(items[k].p*cart[k]).toFixed(3)} KD%0A`;});

}
